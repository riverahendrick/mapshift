<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Mapshift</title>
  <desc id="d">Map your code. Shift to the right model.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d20"/><stop offset=".55" stop-color="#0d1a3d"/><stop offset="1" stop-color="#1a1145"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".45" r=".5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".22"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".15"/><stop offset=".5" stop-color="#5eead4" stop-opacity=".7"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <g stroke="#5eead4" stroke-opacity=".22" stroke-width="1.5" fill="none">
    <path d="M760 90 L870 150 L990 110 L1110 170 L1210 120"/>
    <path d="M870 150 L900 260 L1030 300 L1150 250"/>
    <path d="M990 110 L1030 300"/>
    <path d="M760 90 L700 210 L900 260"/>
    <path d="M1110 170 L1150 250 L1230 330"/>
    <path d="M700 210 L780 330 L1030 300"/>
  </g>
  <g fill="#5eead4">
    <circle cx="760" cy="90" r="5" fill-opacity=".55"/><circle cx="870" cy="150" r="7" fill-opacity=".75"/>
    <circle cx="990" cy="110" r="5" fill-opacity=".55"/><circle cx="1110" cy="170" r="6" fill-opacity=".6"/>
    <circle cx="1210" cy="120" r="4" fill-opacity=".45"/><circle cx="900" cy="260" r="9" fill-opacity=".9"/>
    <circle cx="1030" cy="300" r="6" fill-opacity=".6"/><circle cx="1150" cy="250" r="5" fill-opacity=".5"/>
    <circle cx="700" cy="210" r="4" fill-opacity=".45"/><circle cx="780" cy="330" r="5" fill-opacity=".5"/>
    <circle cx="1230" cy="330" r="4" fill-opacity=".4"/>
  </g>
  <path d="M700 210 L870 150 L900 260 L1110 170" stroke="url(#route)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1110" cy="170" r="10" fill="#c4b5fd"/>
  <circle cx="1110" cy="170" r="18" fill="none" stroke="#c4b5fd" stroke-opacity=".45" stroke-width="2"/>
  <svg x="96" y="100" width="112" height="112" viewBox="0 0 256 256"><defs>
    <linearGradient id="bg-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#162a5c"/>
    </linearGradient>
    <linearGradient id="panelA-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="panelB-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="arrow-b" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg-b)"/>
  <!-- the folded map: three panels -->
  <path d="M52 78 L100 62 L100 188 L52 204 Z" fill="url(#panelA-b)"/>
  <path d="M100 62 L156 80 L156 206 L100 188 Z" fill="url(#panelB-b)"/>
  <path d="M156 80 L204 64 L204 190 L156 206 Z" fill="url(#panelA-b)"/>
  <!-- routes on the map -->
  <g fill="none" stroke="#0b1530" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <path d="M66 170 L88 150 L114 158 L140 128"/>
  </g>
  <g fill="#0b1530" opacity=".6">
    <circle cx="66" cy="170" r="7"/>
    <circle cx="114" cy="158" r="6"/>
  </g>
  <!-- the shift: an arrow cutting up through the map -->
  <path d="M120 176 L176 120" stroke="#0b1530" stroke-width="30" stroke-linecap="round"/>
  <path d="M120 176 L176 120" stroke="url(#arrow-b)" stroke-width="18" stroke-linecap="round"/>
  <path d="M146 104 L192 104 L192 150 Z" fill="#0b1530" stroke="#0b1530" stroke-width="12" stroke-linejoin="round"/>
  <path d="M150 108 L188 108 L188 146 Z" fill="url(#arrow-b)" stroke="url(#arrow-b)" stroke-width="6" stroke-linejoin="round"/></svg>
  <text x="232" y="180" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="84" font-weight="700" letter-spacing="-2" fill="#f1f5ff">Map<tspan fill="#5eead4">shift</tspan></text>
  <text x="100" y="268" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="30" fill="#c7d2fe">Map your code. Shift to the right model.</text>
  <text x="100" y="310" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="20" fill="#8b9bc8">Fewer tokens · Lower cost · Same quality · 100% local</text>
</svg>
