name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Pack and run the packed copy
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global "$RUNNER_TEMP"/mapshift-*.tgz
          mapshift --version
          mapshift map build --project .
          mapshift map find "resolve imports" --project . --limit 1
