name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mapshift version
      description: The output of `mapshift --version`
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent
      options: [Claude Code, Codex, Gemini CLI, Antigravity, Grok, Cursor, Other]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Anything Mapshift printed. Please remove anything private first.
      render: text
